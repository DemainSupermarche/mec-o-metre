<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Mec-o-mètre · Modération</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#FBF4F6; --card:#FFFFFF; --ink:#2B1631; --muted:#7A6680; --line:#EBDCE3;
  --accent:#C81F63; --accent-soft:#FBE3EC; --green:#22865A; --red:#C2303A;
  --display:"Shrikhand", Georgia, serif; --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1C1220; --card:#28192E; --ink:#F6EAF0; --muted:#B49BBC; --line:#3D2A45;
  --accent:#FF5C97; --accent-soft:#3E1E33; --green:#4FC48C; --red:#FF6B74; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:20px}
h1{font-family:var(--display);font-weight:400;color:var(--accent);margin:0;font-size:28px}
h2{margin:0;font-size:18px}
.login{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:0;font:16px var(--body);padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
button{font:600 15px var(--body);border-radius:10px;border:0;padding:10px 14px;cursor:pointer;background:var(--accent);color:#fff}
button.ok{background:var(--green)} button.ko{background:transparent;color:var(--red);border:1.5px solid var(--red)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{color:var(--muted);font-size:14px;min-height:1.5em;margin:0}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.stars{color:var(--accent);letter-spacing:2px}
.item p{margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;margin:0}
.stat{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Modération des avis</h1>
  <form class="login" id="login">
    <label for="key" class="stat" style="flex-basis:100%">Clé d'administration (variable ADMIN_KEY sur Netlify)</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <button type="submit">Afficher les avis</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <div id="zone" hidden>
    <p class="stat" id="stat"></p>
    <section class="list"><h2 id="t-att">En attente</h2><div class="list" id="att"></div></section>
    <section class="list" style="margin-top:24px"><h2>Publiés</h2><div class="list" id="pub"></div></section>
  </div>
</div>
<script>
let key="";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
function card(a,btns){return `<div class="item"><div class="meta"><span>${esc(a.date)}</span><span class="stars">${stars(a.note|0)}</span></div><p>${esc(a.texte)}</p><div class="actions">${btns}</div></div>`}
async function api(method,body){
  const r=await fetch("/api/avis-admin",{method,headers:{"x-admin-key":key,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===401) throw new Error("Clé incorrecte, ou variable ADMIN_KEY absente des réglages Netlify.");
  if(!r.ok) throw new Error("Le serveur a refusé l'action. Réessaie dans un instant.");
  return r.json();
}
async function load(){
  $("msg").textContent="Chargement…";
  try{
    const d=await api("GET");
    $("stat").textContent=`${d.stats.count} avis comptés au total, moyenne ${d.stats.count?(d.stats.sum/d.stats.count).toFixed(1).replace(".",","):"–"} / 3.`;
    $("t-att").textContent=`En attente (${d.attente.length})`;
    $("att").innerHTML=d.attente.length?d.attente.map(a=>card(a,`<button class="ok" data-a="publier" data-id="${esc(a.id)}">Publier</button><button class="ko" data-a="refuser" data-id="${esc(a.id)}">Refuser</button>`)).join(""):'<p class="empty">Aucun commentaire à relire.</p>';
    $("pub").innerHTML=d.publies.length?d.publies.map(a=>card(a,`<button class="ko" data-a="retirer" data-id="${esc(a.id)}">Retirer</button>`)).join(""):'<p class="empty">Aucun commentaire publié.</p>';
    $("zone").hidden=false; $("msg").textContent="";
  }catch(e){$("zone").hidden=true;$("msg").textContent=e.message}
}
$("login").onsubmit=e=>{e.preventDefault();key=$("key").value.trim();load()};
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-a]"); if(!b) return;
  b.disabled=true;
  try{await api("POST",{action:b.dataset.a,id:b.dataset.id});
    await load();
    $("msg").textContent={publier:"Avis publié.",refuser:"Avis refusé et supprimé.",retirer:"Avis retiré du site."}[b.dataset.a];
  }catch(err){b.disabled=false;$("msg").textContent=err.message}
});
</script>
</body>
</html>
